; Orthrus -- multi-surface red team platform for M5Stack Cardputer-Adv.
;
; Two environments on purpose:
;   cardputer-adv : the firmware
;   native        : the pure engines in lib/core, tested on the host
;
; Anything that decides whether a finding is true belongs in lib/core, so it can
; be proven without a board in the room.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform  = espressif32@^6.9.0
board     = m5stack-stamps3
framework = arduino

; Verified against the board on 2026-09-16: 8 MB flash, no PSRAM.
board_build.flash_mode  = qio
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I lib/core
