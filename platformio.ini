; Orthrus -- multi-surface red team platform for M5Stack Cardputer-Adv.
;
; Two environments on purpose:
;   cardputer-adv : the firmware
;   native        : the pure engines in lib/core, tested on the host
;
; Anything that decides whether a finding is true belongs in lib/core, so it can
; be proven without a board in the room.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform  = espressif32@^6.9.0
board     = m5stack-stamps3
framework = arduino

; Verified against the board on 2026-09-16: 8 MB flash, no PSRAM.
board_build.flash_mode  = qio
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_src_filter = +<*> -<selftest_main.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Hardware USB-Serial-JTAG. This is why flashing never needs the BOOT
    ; button -- and also why this build cannot present a USB keyboard, since
    ; every TinyUSB path in the core is gated on !ARDUINO_USB_MODE. The Payload
    ; surface says so on screen rather than failing silently.
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -Wall
    -Wextra
    ; Cheap hardening. This firmware parses bytes shaped by whoever is on the
    ; air, so a smashed stack should abort rather than execute.
    -fstack-protector-strong
    -D_FORTIFY_SOURCE=2
    ; The 802.11w test has to transmit a management frame the IDF's own sanity
    ; check rejects. --wrap redirects exactly that one call; the usual
    ; workaround, -Wl,-zmuldefs, turns off duplicate-symbol detection for the
    ; WHOLE link and would silently hide a real one-definition-rule bug.
    ; See src/modules/wifi_deauth.cpp.
    -Wl,--wrap=ieee80211_raw_frame_sanity_check
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0
    ; NimBLE rather than the bundled Bluedroid stack. Measured reason: this
    ; board has no PSRAM, the frame buffer already holds 65 KB, and Bluedroid's
    ; BLE-only footprint is several times NimBLE's. A scanner that runs out of
    ; heap in the field is worse than one that is not there.
    h2zero/NimBLE-Arduino@^1.4.2

; BadUSB build. Identical firmware, except the USB peripheral presents a
; TinyUSB keyboard instead of the hardware USB-JTAG.
;
; The trade-off is real and was measured, not assumed: under mode 0 esptool
; cannot reset the board into download mode on its own, so a plain upload fails
; with "No serial data received". tools/usb_touch_reset.py performs the
; standard 1200-baud touch first, which the Arduino USB stack answers by
; rebooting into the ROM bootloader. With it, flashing works normally; without
; it, you need the BOOT button.
;
;   pio run -e cardputer-adv-hid -t upload
[env:cardputer-adv-hid]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DCONFIG_TINYUSB_HID_ENABLED=1
extra_scripts = pre:tools/usb_touch_reset.py

; On-device self-test. Never ships inside the product: it is its own binary.
;   pio run -e selftest -t upload
[env:selftest]
extends = env:cardputer-adv
build_src_filter = +<*> -<main.cpp>
; The board may be running the HID build when this is flashed, and that build
; cannot be reset by esptool on its own. The hook is a no-op otherwise.
extra_scripts = pre:tools/usb_touch_reset.py

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I lib/core
